<!DOCTYPE html>
<html lang="en">
<head>

    <title>VetApp</title>

<body class="body scroll--style">
    <header class="haeder">
        <figure class="logo">
            <i class="fa-solid fa-paw logo__image"></i>
            <label class="logo__label">VetApp</label>
        </figure>
        <button class="fa-solid fa-circle-user header__button--menu" onclick="menuOpenHandler('Pacientes')"></button>

            <div class="nav__button">
                <button class="fa-solid fa-xmark nav__button--close" onclick="menuCloseHandler()"></button>
            </div>
            <ul class="nav__ul">
                <a class="nav__ul--link" href="../profile/profile.html">Perfil</a>
                <a class="nav__ul--link" id="link-page" href="../patients/patients.html">Xxxxxx</a>
                <a class="nav__ul--link" href="../turn/turn.html">Turnos</a>

            </ul>
        </nav>
    </header>
    <main class="main">

                </div>
            </div>
            <div class="main__content--data">
                <form class="data">
                    <div id="section__1" class="data__section">
                        <div class="section__header">
                            <button class="fa-solid fa-caret-down section__header--menu" onclick="openSectionhandler('section__1')"></button>
                            <h4 class="section__header--title">Información personal.</h4>
                        </div>
                        <div class="section__content">
                            <div class="section__items">
                                <div class="data__item">

                                    <input class="data__item--input" type="text">
                                </div>

                                    <label class="data__item--label">Apellido</label>

                                    <input class="data__item--input" type="text">
                                </div>
                            </div>
                            <div class="section__items">
                                <div class="data__item">
                                    <label class="data__item--label">Email</label>
                                    <input class="data__item--input" type="text">
                                </div>
                                <div class="data__item">
                                    <label class="data__item--label">Username</label>
                                    <input class="data__item--input" type="text">
                                </div>
                                <div class="data__item">
                                    <label class="data__item--label">Teléfono</label>
                                    <input class="data__item--input" type="text">
                                </div>
                                <div class="data__item">
                                    <label class="data__item--label">Campo</label>
                                    <input class="data__item--input" type="text">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="section__2" class="data__section">
                        <div class="section__header">
                            <button class="fa-solid fa-caret-down section__header--menu" onclick="openSectionhandler('section__2')"></button>
                            <h4 class="section__header--title">Información Profesional.</h4>
                        </div>
                        <div class="section__content">
                            <div class="section__items">
                                <div class="data__item">

                                </div>
                                <div class="data__item">
                                    <label class="data__item--label">Campo</label>
                                    <input class="data__item--input" type="text">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p class="footer__p">VetApp - derechos reservados</p>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetApp</title>
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="../../cross-components/header/header.css">
    <link rel="stylesheet" href="../../cross-components/footer/footer.css">
    <link rel="stylesheet" href="../../cross-components/main-component/main-component.css">
    <link rel="stylesheet" href="../../cross-components/turn-filter/turn-filter.css">
    <link rel="stylesheet" href="../../cross-components/grid-component/grid-component.css">
    <link rel="stylesheet" href="../../cross-components/pet-detail-card/pet-detail-card.css">
    <script src="https://kit.fontawesome.com/33c5bb1d43.js" crossorigin="anonymous"></script>
    <script src="../../cross-components/header/header.js"></script>
</head>
<body class="body scroll--style">
    <header class="haeder"></header>
    <main class="main">
        <h1 class="main__title">Mis Mascotas</h1>
        <div class="main__content">
            <div class="main__content--filter">
                <div class="content__filter"></div>
            </div>
            <div class="main__content--data">
                <div class="content">
                    <div class="content__items">
                        <h3 class="items--title">+ Añadir Mascota</h3>
                    </div>
                    <div class="card__content">
                        <figure class="card__image">
                            <img class="card__image--size" src="../../../src/assets/oli.jfif" alt="perro_oli">
                        </figure>
                        <div class="card__content--data">
                            <div class="card__item">
                                <label class="card__item--label">Nombre</label>
                                <p class="card__item--p">Oli</p>
                            </div>
                            <div class="card__item">
                                <label class="card__item--label">Edad</label>
                                <p class="card__item--p">4 años</p>
                            </div>
                            <div class="card__item">
                                <label class="card__item--label">Raza</label>
                                <p class="card__item--p">Mestizo</p>
                            </div>
                            <div class="card__item">
                                <label class="card__item--label">Sexo</label>
                                <p class="card__item--p">Macho</p>
                            </div>
                        </div>
                    </div>
    </main>
    <footer class="footer"></footer>
</body>
</html>

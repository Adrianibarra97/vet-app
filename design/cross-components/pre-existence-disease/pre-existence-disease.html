<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetApp</title>
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="../../cross-components/header/header.css">
    <link rel="stylesheet" href="../../cross-components/footer/footer.css">
    <link rel="stylesheet" href="../../cross-components/main-component-detail/main-component-detail.css">
    <link rel="stylesheet" href="../../cross-components/recipe-card/recipe-card.css">
    <link rel="stylesheet" href="../../cross-components/pre-existence-disease/pre-existence-disease.css">
    <script src="https://kit.fontawesome.com/33c5bb1d43.js" crossorigin="anonymous"></script>
    <script src="../../cross-components/header/header.js"></script>
</head>
<body class="body scroll--style">
    <header class="haeder"></header>
    <main class="main-detail">
        <div class="detail--title">
            <p class="title__item">Oli</p>
            <p class="title__item">4 Años</p>
        </div>
        <div class="detail-content">
            <div class="content__data">
                <figure class="data__image">
                    <img class="data_image--size" src="../../../src/assets/oli.jfif" alt="">
                </figure>
                <div class="data__detail">
                    <div class="detail--data">
                        <p class="data__item--title">Información general</p>
                    </div>
                    <div class="detail--data">
                        <p class="data__item">Perro</p>
                        <p class="data__item">Mestizo</p>
                    </div>
                    <div class="detail--data">
                        <p class="data__item">Castrado</p>
                        <p class="data__item">13,5 Kg</p>
                    </div>
                    <div class="detail--data">
                        <p class="data__item">Macho</p>
                        <p class="data__item">04/02/2021</p>
                    </div>
                </div>
            </div>
            <div class="content__data2">
                <h2 class="content__data2--title">Historial Médico</h2>
                <div class="content__data2--section">
                    <div class="content--title">
                        <select class="content--selection" default = "one">
                            <option value="one">Vacunas</option>
                            <option value="two">Recetas</option>
                            <option value="three">Enfermedades Pre-existentes</option>
                            <option value="three">Resultado de estudios</option>
                        </select>
                    </div>
                    <div class="conten--data scroll__detail--style">
                        <div class="content__data--item">
                            <div class="existence__disease--container">
                                <div class="disease__item--name">
                                    <label class="disease__item--label">Nombre</label>
                                    <p>Moquillo</p>
                                </div>
                                <div class="disease__item-description">
                                    <label class="disease__item--label">Descripcion</label>
                                    <p>El moquillo canino, también conocido como distemper, es una enfermedad viral que afecta a los perros. Es altamente contagiosa y puede ser fatal, especialmente si no se trata a tiempo. </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"></footer>
</body>
</html>
